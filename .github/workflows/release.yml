name: Release

on:
  push:
    branches: [main]
    paths:
      - 'package.json'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      gateway_changed: ${{ steps.check.outputs.gateway_changed }}
      gateway_version: ${{ steps.check.outputs.gateway_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect version changes
        id: check
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          PREVIOUS=$(git show HEAD~1:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version" 2>/dev/null || echo "")
          if [ "$CURRENT" != "$PREVIOUS" ] && [ -n "$PREVIOUS" ]; then
            echo "gateway_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "gateway_changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "gateway_version=$CURRENT" >> "$GITHUB_OUTPUT"

  release-gateway:
    needs: [ci, detect-changes]
    if: needs.detect-changes.outputs.gateway_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Create Git tag
        run: |
          git tag "v${{ needs.detect-changes.outputs.gateway_version }}" 2>/dev/null || true
          git push origin "v${{ needs.detect-changes.outputs.gateway_version }}" 2>/dev/null || true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.detect-changes.outputs.gateway_version }}" \
            --title "v${{ needs.detect-changes.outputs.gateway_version }}" \
            --generate-notes \
            --latest 2>/dev/null || echo "Release already exists, continuing..."

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: vgpastor
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/vgpastor/messaginggateway:${{ needs.detect-changes.outputs.gateway_version }}
            ghcr.io/vgpastor/messaginggateway:latest
            vgpastor/messaging-gateway:${{ needs.detect-changes.outputs.gateway_version }}
            vgpastor/messaging-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # srv07 runs the image from Docker Hub with docker compose. The deploy key can only run
  # /usr/local/sbin/messaging-gateway-deploy (deploy/srv07/messaging-gateway-deploy.sh), which takes the version.
  deploy-srv07:
    needs: [detect-changes, release-gateway]
    runs-on: ubuntu-latest
    # The key is an environment secret: only runs from main can read it.
    environment: srv07
    permissions: {}
    concurrency: srv07-deploy
    # The script waits up to 30 min for the health check (migrations run before the gateway listens).
    timeout-minutes: 40
    steps:
      - name: Deploy to srv07
        env:
          HOST: srv07.ingenierosweb.co
          SSH_KEY: ${{ secrets.SRV07_DEPLOY_KEY }}
          VERSION: ${{ needs.detect-changes.outputs.gateway_version }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          # Pinned on purpose. If the server key rotates: ssh-keyscan -t ed25519 "$HOST" and check it out of band.
          echo "$HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBcznWLBEBj0x0Y/w6mhRzYzCsunu5jUwMC8Pd/aQd10" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 "root@$HOST" "$VERSION"
