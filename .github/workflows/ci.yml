name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mg_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mg_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/mg_test

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  sdk-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/sdk/package-lock.json

      - name: Install SDK dependencies
        working-directory: packages/sdk
        run: npm ci

      - name: Type check SDK
        working-directory: packages/sdk
        run: npm run lint

      - name: Build SDK
        working-directory: packages/sdk
        run: npm run build

      - name: Test SDK
        working-directory: packages/sdk
        run: npm test

  sdk-sync-check:
    runs-on: ubuntu-latest
    # Runs on every change except Dependabot's branches: a dependency update does not change the API.
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'dependabot/'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install SDK dependencies
        working-directory: packages/sdk
        run: npm ci

      - name: Build gateway (needed for schema export)
        run: npm run build

      - name: Export OpenAPI schema
        run: npm run openapi:export

      - name: Regenerate SDK from schema
        run: cd packages/sdk && npm run generate && node ../../scripts/fix-generated-imports.js

      - name: Check for uncommitted changes (ignoring version comment)
        run: |
          # Ignore the "OpenAPI spec version" comment line — it changes on every version bump
          DIFF=$(git diff packages/sdk/src/generated/ | grep '^[+-]' | grep -v '^[+-][+-][+-]' | grep -v 'OpenAPI spec version' || true)
          if [ -n "$DIFF" ]; then
            echo "❌ SDK is out of sync with OpenAPI schema!"
            echo "Run 'npm run sdk:generate' and commit the changes."
            git diff --stat packages/sdk/src/generated/
            echo "$DIFF"
            exit 1
          fi
          echo "✅ SDK is in sync with OpenAPI schema"
